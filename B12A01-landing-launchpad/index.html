<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Launchpad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <h2 class="logo">LOGO</h2>
      <button class="btn">Sign Up</button>
    </nav>
    <div class="banner">
      <h1>Cool Dark UI Template for Webflow Agencies!</h1>
      <button class="btn">Stay Focused</button>
    </div>
  </header>
  <main>
    <section class="action">
      <div class="action-info">
        <h2>See It in Action</h2>
        <p>Explore the live preview and imagine your brand in this bold new look.</p>
        <button class="btn">Launch Live Preview</button>
      </div>
      <div class="action-img">
        <img src="./Assets/wc-big.png" alt="preview">
      </div>
    </section>
  </main>
</body>
</html>
